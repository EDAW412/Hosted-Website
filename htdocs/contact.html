<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="images/Laezel_cat.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Velnor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('images/Laezel_cat.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }
        .contact-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .contact-card {
            border-radius: 1.5rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(240, 240, 240, 0.95));
            color: #2c3e50;
            width: 100%;
            max-width: 700px;
            animation: fadeInUp 1s ease-out;
            transition: transform 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-5px);
        }
        .contact-card h2 {
            color: #ff6600;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .contact-card p {
            margin-bottom: 1.5rem;
            line-height: 1.7;
            font-size: 1.15rem;
            color: #34495e;
        }
        .contact-card ul {
            margin-bottom: 1.5rem;
            padding-left: 20px;
            font-size: 1.15rem;
            color: #34495e;
        }
        .contact-card li {
            margin-bottom: 0.5rem;
        }
        .highlight {
            color: #ff6600;
            font-weight: 600;
        }
        .btn-orange {
            background-color: #ff6600;
            border-color: #ff6600;
            color: #fff;
            font-weight: 500;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn-orange:hover {
            background-color: #e65c00;
            border-color: #e65c00;
            transform: scale(1.05);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 768px) {
            .contact-card {
                padding: 2rem;
            }
            .contact-card h2 {
                font-size: 2.2rem;
            }
            .contact-card p,
            .contact-card ul {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <div class="contact-card">
            <h2>Contact Us</h2>
            <p><strong class="highlight">Phone:</strong> +27 12 345 6789</p>
            <p><strong class="highlight">Email:</strong> support@yourmarketplace.co.za</p>
            <p><strong class="highlight">Address:</strong> 123 Market Street, Johannesburg, South Africa</p>
            <p><strong class="highlight">Trading Hours:</strong></p>
            <ul>
                <li>Monday - Friday: 08:00 - 17:00</li>
                <li>Saturday: 09:00 - 14:00</li>
                <li>Sunday & Public Holidays: Closed</li>
            </ul>
            <div class="text-center">
                <a href="index.html" class="btn btn-orange mt-3">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
