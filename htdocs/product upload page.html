<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Product - Laezel Cat Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f4f4f4;
            padding-top: 40px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            color: #007bff;
            text-align: center;
        }
        input[type="file"] {
            padding: 3px;
        }
        button.btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Add a New Product</h2>
    <form action="add product.php" method="POST" enctype="multipart/form-data" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input id="name" type="text" name="name" placeholder="Product Name" required class="form-control" />
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" placeholder="Description" required class="form-control" rows="4"></textarea>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="price" class="form-label">Price (R)</label>
                <input id="price" type="number" name="price" step="0.01" placeholder="Price" required class="form-control" />
            </div>
            <div class="col-md-6">
                <label for="quantity" class="form-label">Quantity</label>
                <input id="quantity" type="number" name="quantity" placeholder="Quantity" required class="form-control" />
            </div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select id="category" name="category" required class="form-select">
                <option value="" disabled selected>Select Category</option>
                <option value="Cars">Cars</option>
                <option value="Toys">Toys</option>
                <option value="Jewellery">Jewellery</option>
                <option value="Pets">Pets</option>
                <option value="Fashion">Fashion</option>
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Books">Books</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="image" class="form-label">Upload Product Image</label>
            <input id="image" type="file" name="image" required class="form-control" accept="image/*" />
        </div>

        <button type="submit" class="btn btn-primary">Add Product</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
